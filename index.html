<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#22293A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>আমার হিসাব</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBF6EC;
  --paper-line:#E4D8C3;
  --ink:#22293A;
  --ink-soft:#5B6478;
  --red:#A32C22;
  --red-soft:#C3564A;
  --brass:#AD8A3B;
  --brass-dark:#8C6F2C;
  --sage:#3F6B52;
  --card:#FFFEFB;
  --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Hind Siliguri',Arial,sans-serif;
  background:
    repeating-linear-gradient(to bottom, transparent 0 34px, var(--paper-line) 35px),
    var(--paper);
  margin:0;padding:14px 12px 50px;color:var(--ink);
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:960px;margin:auto}

/* ---- cover / header ---- */
.cover{
  position:relative;
  background:linear-gradient(160deg,#22293A,#2E3850 60%,#22293A);
  color:#F4EEE0;
  border-radius:var(--radius);
  padding:22px 18px 20px 38px;
  overflow:hidden;
  box-shadow:0 8px 22px rgba(34,41,58,.25);
}
.cover::before{
  content:"";
  position:absolute;left:0;top:0;bottom:0;width:22px;
  background:
    radial-gradient(circle at 11px 18px, var(--paper) 4px, transparent 5px),
    linear-gradient(#3a4358,#3a4358);
  background-repeat:repeat-y;background-size:22px 30px,100% 100%;
}
.cover h1{
  font-family:'Tiro Bangla',serif;font-weight:400;
  margin:0 0 4px;font-size:24px;letter-spacing:.3px;
}
.cover .tagline{margin:0 0 12px;font-size:12.5px;color:#C9CFDC;letter-spacing:.2px}
.status{
  display:inline-block;font-size:12px;padding:5px 12px;border-radius:20px;
  background:rgba(244,238,224,.12);color:#F4EEE0;border:1px solid rgba(244,238,224,.25);
}
.sync-note{font-size:11px;color:#C9CFDC;margin-top:6px}

/* ---- totals strip ---- */
.strip{
  display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-radius:var(--radius);
  margin:12px 0;box-shadow:0 3px 12px rgba(34,41,58,.08);overflow:hidden;
}
.strip .item{padding:14px 8px;text-align:center;position:relative}
.strip .item:nth-child(-n+2){border-bottom:1px solid var(--paper-line)}
.strip .item:nth-child(odd){border-right:1px solid var(--paper-line)}
.strip .item span{display:block}
.strip .lbl{font-size:11px;color:var(--ink-soft);margin-bottom:5px}
.strip .val{font-family:'Tiro Bangla',serif;font-size:17px;font-weight:400;color:var(--ink)}
.strip .val.red{color:var(--red)}
.strip .val.sage{color:var(--sage)}
.budget-item{position:relative}
.edit-btn{background:transparent;color:var(--brass-dark);border:none;padding:8px;margin:-8px;font-size:15px;font-weight:400;cursor:pointer;vertical-align:middle;min-width:32px;min-height:32px}
.edit-btn:active{color:var(--ink)}
.budget-edit{display:flex;gap:6px;justify-content:center;align-items:center;margin-top:2px}
.budget-edit input{width:78px;padding:8px;font-size:16px}
.budget-edit button{padding:8px 12px;font-size:14px}

/* ---- sheets (cards) ---- */
.sheet{
  background:var(--card);border-radius:var(--radius);padding:16px 16px;
  margin:12px 0;box-shadow:0 3px 12px rgba(34,41,58,.08);
}
.sheet h3{
  font-family:'Tiro Bangla',serif;font-weight:400;margin:0 0 12px;
  font-size:16px;color:var(--ink);display:flex;align-items:center;gap:8px;
}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
.grid.entry{grid-template-columns:1fr}
label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;color:var(--ink-soft)}
input,select{
  width:100%;padding:13px 12px;border:1px solid var(--paper-line);border-radius:9px;
  background:#fff;font-family:inherit;font-size:16px;color:var(--ink);
}
input:focus,select:focus{outline:2px solid var(--brass);outline-offset:1px;border-color:var(--brass)}
button{
  border:0;padding:13px 16px;border-radius:9px;cursor:pointer;font-weight:600;
  background:var(--brass);color:#fff;font-family:inherit;font-size:15px;transition:filter .15s;
  min-height:46px;
}
button:active{filter:brightness(.9)}
button.primary{background:var(--ink);width:100%}
button.ghost{background:transparent;color:var(--brass-dark);border:1px solid var(--brass);padding:11px 15px;width:100%}
button.danger-row{background:transparent;color:var(--red-soft);padding:8px 10px;font-size:16px;min-height:auto}
button.danger-row:active{background:#FBEAE8}

.tools{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.filters{display:flex;gap:10px;flex-wrap:wrap}
.filters>div{flex:1;min-width:0}
.tools .actions{display:flex;gap:8px}

/* ---- ledger table ---- */
.table-wrap{position:relative;margin-top:14px;padding-left:10px;border-left:2px solid var(--red-soft);overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 6px;border-bottom:1px dashed var(--paper-line);text-align:left;font-size:13px}
th{font-family:'Tiro Bangla',serif;font-weight:400;color:var(--ink-soft);font-size:12px;border-bottom:1px solid var(--paper-line)}
td:first-child,th:first-child{white-space:nowrap}
.amount{font-weight:700;color:var(--red);white-space:nowrap}
.pend-dot{color:var(--brass);font-size:9px;vertical-align:middle}
.empty{text-align:center;color:var(--ink-soft);padding:26px 10px;font-style:italic}
.summary-line{
  display:flex;flex-wrap:wrap;justify-content:flex-end;gap:14px;padding:12px 4px 2px;font-size:12.5px;color:var(--ink-soft);
}
.summary-line b{color:var(--ink)}

@media(min-width:640px){
  body{padding:20px 14px 60px}
  .cover{padding:30px 26px 24px 48px}
  .cover::before{width:26px;background-size:26px 34px,100% 100%;background-position:13px 18px}
  .cover h1{font-size:30px}
  .cover .tagline{font-size:13px}
  .strip{grid-template-columns:repeat(4,1fr)}
  .strip .item:nth-child(-n+2){border-bottom:none}
  .strip .item:not(:last-child){border-right:1px solid var(--paper-line)}
  .strip .val{font-size:19px}
  .sheet{padding:20px 22px}
  .sheet h3{font-size:17px}
  .grid.entry{grid-template-columns:1.1fr 2fr 1fr auto;align-items:end}
  button.primary,button.ghost{width:auto}
  .tools{flex-direction:row;justify-content:space-between;align-items:end}
  .filters>div{min-width:170px;flex:none}
  .table-wrap{padding-left:16px}
  th,td{padding:11px 10px;font-size:13.5px}
  .budget-edit input{width:100px}
}
</style>
</head>
<body>
<div class="wrap">

<div class="cover">
  <h1>💰 আমার হিসাব</h1>
  <div class="tagline">দৈনিক খরচের ডিজিটাল খাতা</div>
  <div class="status" id="status">লোড হচ্ছে...</div>
  <div class="sync-note" id="syncNote"></div>
</div>

<div class="strip">
  <div class="item budget-item">
    <span class="lbl">এই মাসের বাজেট</span>
    <span class="val" id="budgetDisplay"><span id="budget">০.০০ ৳</span><button class="edit-btn" id="editBudget" title="বাজেট এডিট করুন">✎</button></span>
    <span class="budget-edit" id="budgetEdit" style="display:none">
      <input id="budgetInput" type="number" min="0" step="0.01" placeholder="যেমন 30000">
      <button id="saveBudget">✓</button>
    </span>
  </div>
  <div class="item"><span class="lbl">এই মাসের খরচ</span><span class="val red" id="spent">০.০০ ৳</span></div>
  <div class="item"><span class="lbl">অবশিষ্ট টাকা</span><span class="val sage" id="left">০.০০ ৳</span></div>
  <div class="item"><span class="lbl">আজকের খরচ</span><span class="val red" id="today">০.০০ ৳</span></div>
</div>

<div class="sheet">
  <h3>✎ নতুন খরচ</h3>
  <form id="form"><div class="grid entry">
    <div><label>তারিখ</label><input id="date" type="date" required></div>
    <div><label>বিবরণ</label><input id="details" required placeholder="যেমন বাজার"></div>
    <div><label>টাকা</label><input id="amount" type="number" min="0.01" step="0.01" required></div>
    <button type="submit" class="primary">যোগ করুন</button>
  </div></form>
</div>

<div class="sheet">
  <div class="tools">
    <div class="filters">
      <div><label>রিপোর্টের মাস</label><input id="month" type="month"></div>
    </div>
    <div class="actions">
      <button class="ghost" id="download">⬇ মাসের রিপোর্ট ডাউনলোড</button>
    </div>
  </div>
  <div class="table-wrap">
    <table><thead><tr><th>তারিখ</th><th>বিবরণ</th><th>টাকা</th><th></th></tr></thead><tbody id="list"></tbody></table>
  </div>
  <div class="summary-line" id="summaryLine"></div>
</div>

</div>

<script type="module">
const firebaseConfig={
apiKey:"AIzaSyCU2xBcj8W1NXG7_7EO9CC33yAMtRQ9u5Q",
authDomain:"shipon-6e337.firebaseapp.com",
projectId:"shipon-6e337",
storageBucket:"shipon-6e337.firebasestorage.app",
messagingSenderId:"680199241257",
appId:"1:680199241257:web:fb2b2faae39cde18582638",
measurementId:"G-G07ZGZTY0Q"
};

const LS_DATA="hisab_expenses_v1",LS_BUDGETS="hisab_budgets_v1";
const $=id=>document.getElementById(id);
const bn=n=>Number(n||0).toFixed(2).replace(/[0-9]/g,d=>"০১২৩৪৫৬৭৮৯"[d]);
const today=()=>{let d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const month=()=>new Date().toISOString().slice(0,7);
const uid=()=>"local_"+Date.now()+"_"+Math.random().toString(36).slice(2,8);

let data=[],budgets={},currentItems=[];
let budgetsPending=false;
let fb=null; // holds {db,exp,settings,addDoc,getDocs,deleteDoc,doc,setDoc,getDoc} once Firebase loads
let syncing=false;

function loadLocal(){
 try{data=JSON.parse(localStorage.getItem(LS_DATA)||"[]")}catch(e){data=[]}
 try{budgets=JSON.parse(localStorage.getItem(LS_BUDGETS)||"{}")}catch(e){budgets={}}
}
function saveLocal(){
 localStorage.setItem(LS_DATA,JSON.stringify(data));
 localStorage.setItem(LS_BUDGETS,JSON.stringify(budgets));
}
function pendingCount(){return data.filter(x=>!x.synced||x.pendingDelete).length+(budgetsPending?1:0)}
function updateStatus(){
 if(!navigator.onLine){$("status").textContent="📴 অফলাইন — ডাটা ফোনেই সেভ আছে";}
 else if(!fb){$("status").textContent="📴 অফলাইন মোড — ডাটা ফোনেই সেভ আছে";}
 else if(syncing){$("status").textContent="🔄 সিঙ্ক হচ্ছে...";}
 else{$("status").textContent="☁️ অনলাইনে সিঙ্ক হয়েছে";}
 let p=pendingCount();
 $("syncNote").textContent=p>0?`${bn(p).replace(".০০","")}টি পরিবর্তন সিঙ্ক হওয়া বাকি — নেট এলে অটো সিঙ্ক হবে`:"";
}

async function initFirebase(){
 try{
  const {initializeApp}=await import("https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js");
  const {getFirestore,collection,addDoc,getDocs,deleteDoc,doc,setDoc,getDoc}=await import("https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js");
  const app=initializeApp(firebaseConfig),db=getFirestore(app);
  fb={db,exp:collection(db,"expenses"),settings:doc(db,"settings","main"),addDoc,getDocs,deleteDoc,doc,setDoc,getDoc};
  return true;
 }catch(e){fb=null;return false}
}

async function sync(){
 if(!fb||!navigator.onLine||syncing)return;
 syncing=true;updateStatus();
 try{
  // push new local entries not yet on server
  for(const item of data.filter(x=>!x.synced&&!x.pendingDelete)){
   try{
    const ref=await fb.addDoc(fb.exp,{date:item.date,details:item.details,amount:item.amount,createdAt:item.createdAt});
    item.id=ref.id;item.synced=true;
   }catch(e){/* stays pending, retry next time */}
  }
  // push pending deletes
  for(const item of data.filter(x=>x.pendingDelete)){
   if(item.synced){
    try{await fb.deleteDoc(fb.doc(fb.db,"expenses",item.id));data=data.filter(d=>d!==item)}catch(e){/* retry later */}
   }else{data=data.filter(d=>d!==item)}
  }
  // push budgets if changed offline
  if(budgetsPending){
   try{await fb.setDoc(fb.settings,{budgets},{merge:true});budgetsPending=false}catch(e){/* retry later */}
  }
  // pull latest from server and merge with any still-unsynced local items
  const s=await fb.getDocs(fb.exp);
  const remote=s.docs.map(x=>({id:x.id,...x.data(),synced:true}));
  const stillLocal=data.filter(x=>!x.synced);
  data=[...remote,...stillLocal];
  const b=await fb.getDoc(fb.settings);
  if(!budgetsPending)budgets=b.exists()?b.data().budgets||{}:{};
  saveLocal();render();
 }catch(e){/* connection dropped mid-sync, will retry on next online event */}
 syncing=false;updateStatus();
}

function render(){
 let m=$("month").value||month();
 let items=data.filter(x=>!x.pendingDelete&&(x.date||"").slice(0,7)==m);
 currentItems=items;
 let total=items.reduce((s,x)=>s+Number(x.amount||0),0),bud=Number(budgets[m]||0);
 let td=data.filter(x=>!x.pendingDelete&&x.date==today()).reduce((s,x)=>s+Number(x.amount||0),0);
 $("budget").textContent=bn(bud)+" ৳";$("spent").textContent=bn(total)+" ৳";$("left").textContent=bn(bud-total)+" ৳";$("today").textContent=bn(td)+" ৳";$("budgetInput").value=bud||"";
 items.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
 $("list").innerHTML=items.length?items.map(x=>`<tr><td>${x.date}</td><td>${esc(x.details)}${x.synced?"":' <span class="pend-dot" title="সিঙ্ক বাকি">●</span>'}</td><td class="amount">${bn(x.amount)} ৳</td><td><button class="danger-row" data-id="${x.id}">🗑️</button></td></tr>`).join(""):`<tr><td colspan="4" class="empty">এই মাসে কোনো হিসাব নেই।</td></tr>`;
 $("summaryLine").innerHTML=items.length?`মোট এন্ট্রি: <b>${bn(items.length).replace(".০০","")}</b>&nbsp; মোট খরচ: <b>${bn(total)} ৳</b>`:"";
 updateStatus();
}
function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}

$("form").onsubmit=e=>{
 e.preventDefault();
 let x={id:uid(),date:$("date").value,details:$("details").value.trim(),amount:Number($("amount").value),createdAt:Date.now(),synced:false};
 if(!x.date||!x.details||x.amount<=0)return alert("সব তথ্য সঠিকভাবে দিন");
 data.push(x);saveLocal();render();
 $("details").value="";$("amount").value="";
 sync();
};
$("editBudget").onclick=()=>{
 $("budgetDisplay").style.display="none";
 $("budgetEdit").style.display="flex";
 $("budgetInput").focus();
};
$("saveBudget").onclick=()=>{
 let m=$("month").value||month(),v=Number($("budgetInput").value||0);
 budgets[m]=v;budgetsPending=true;saveLocal();render();
 $("budgetEdit").style.display="none";$("budgetDisplay").style.display="";
 sync();
};
$("month").onchange=render;
$("list").onclick=e=>{
 let b=e.target.closest("[data-id]");if(!b)return;
 if(!confirm("এই হিসাবটি মুছবেন?"))return;
 let item=data.find(x=>x.id===b.dataset.id);
 if(!item)return;
 item.pendingDelete=true;
 saveLocal();render();
 sync();
};
$("download").onclick=()=>{
 if(!currentItems.length)return alert("এই মাসে কোনো হিসাব নেই, ডাউনলোড করার কিছু নেই।");
 let m=$("month").value||month();
 let rows=[["তারিখ","বিবরণ","টাকা"]];
 let sorted=[...currentItems].sort((a,b)=>(a.date||"").localeCompare(b.date||""));
 sorted.forEach(x=>rows.push([x.date,x.details,Number(x.amount||0).toFixed(2)]));
 let total=sorted.reduce((s,x)=>s+Number(x.amount||0),0);
 rows.push(["","মোট",total.toFixed(2)]);
 let csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\r\n");
 let blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});
 let a=document.createElement("a");
 a.href=URL.createObjectURL(blob);a.download=`hisab_${m}.csv`;
 document.body.appendChild(a);a.click();a.remove();
};

window.addEventListener("online",sync);
window.addEventListener("offline",updateStatus);
setInterval(()=>{if(navigator.onLine&&pendingCount()>0)sync()},20000);

$("date").value=today();$("month").value=month();
loadLocal();render();
initFirebase().then(ok=>{if(ok)sync();else updateStatus()});
</script>
</body>
</html>
